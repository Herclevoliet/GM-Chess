<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>GM-Chess</title>
  <link rel="stylesheet" href="lib/chessboard-1.0.0.min.css">

  <style>
#boardContainer {
  position: relative;
  width: 95vw;       
  max-width: 500px;  
  margin: auto;       
}

#board {
  width: 100%;
  aspect-ratio: 1 / 1; 
}

.selected-square {
  box-shadow: inset 0 0 0 4px #f1c40f;
}

.legal-move {
  box-shadow: inset 0 0 0 4px rgba(46, 204, 113, 0.8);
}

.last-move {
  background-color: rgba(241, 196, 15, 0.4) !important;
}

#gameMessage {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 28px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10;
}

#gameMessage.show {
  opacity: 1;
}

.fade {
  opacity: 0;
  transition: opacity 0.4s ease;
}
.fade.show {
  opacity: 1;
}

.board-color-1 .white-1e1d7 { background: #f0d9b5 !important; }
.board-color-1 .black-3c85d { background: #b58863 !important; }

.board-color-2 .white-1e1d7 { background: #eaeaea !important; }
.board-color-2 .black-3c85d { background: #555 !important; }

.board-color-3 .white-1e1d7 { background: #cfe2f3 !important; }
.board-color-3 .black-3c85d { background: #2f5597 !important; }

.board-color-4 .white-1e1d7 { background: #fce5cd !important; }
.board-color-4 .black-3c85d { background: #783f04 !important; }

button, select {
  margin-top: 10px;
  padding: 10px 14px;
  font-size: 16px;
  min-height: 44px;  
  cursor: pointer;
}
</style>
</head>

<body>

  <div id="boardContainer">
  <div id="board" class="fade show"></div>
  <div id="gameMessage"></div>
</div>

  <button id="newBtn">New Scenario</button>
  <button id="restartBtn">Restart Scenario</button>

  <select id="themeSelect">
    <option value="wikipedia">Wikipedia</option>
    <option value="alpha">Alpha</option>
    <option value="uscf">USCF</option>
  </select>

  <script src="lib/jquery.min.js"></script>
  <script src="lib/chess.min.js"></script>
  <script src="lib/chessboard-1.0.0.min.js"></script>
  <script src="game.js"></script>

</body>
</html>
