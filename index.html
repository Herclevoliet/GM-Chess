<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>GM-Chess</title>
  <link rel="stylesheet" href="lib/chessboard-1.0.0.min.css">

  <style>
#boardContainer {
  position: relative;
  width: 95vw;       
  max-width: 500px;  
  margin: auto;       
}

#board {
  width: 100%;
  aspect-ratio: 1 / 1; 
}

.selected-square {
  box-shadow:
    inset 0 0 25px rgba(0, 120, 255, 0.9),
    0 0 18px rgba(0, 120, 255, 0.6);
}

.legal-move {
  box-shadow:
    inset 0 0 20px rgba(46, 204, 113, 0.9),
    0 0 12px rgba(46, 204, 113, 0.6);
}

.last-move {
  box-shadow:
    inset 0 0 22px rgba(241, 196, 15, 0.9),
    0 0 16px rgba(241, 196, 15, 0.7);
}

.selected-square,
.legal-move,
.last-move {
  transition: all 0.4s ease;
}

@keyframes pulseGlow {
  0% {
    box-shadow:
      inset 0 0 20px rgba(0, 120, 255, 0.9),
      0 0 12px rgba(0, 120, 255, 0.6);
  }
  50% {
    box-shadow:
      inset 0 0 35px rgba(0, 120, 255, 1),
      0 0 25px rgba(0, 120, 255, 0.9);
  }
  100% {
    box-shadow:
      inset 0 0 20px rgba(0, 120, 255, 0.9),
      0 0 12px rgba(0, 120, 255, 0.6);
  }
}

.selected-square.pulse {
  animation: pulseGlow 1.2s infinite ease-in-out;
}

#gameMessage {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 28px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10;
}

#gameMessage.show {
  opacity: 1;
}

.fade {
  opacity: 0;
  transition: opacity 0.4s ease;
}
.fade.show {
  opacity: 1;
}

.board-color-1 .white-1e1d7 { background: #f0d9b5 !important; }
.board-color-1 .black-3c85d { background: #b58863 !important; }

.board-color-2 .white-1e1d7 { background: #eaeaea !important; }
.board-color-2 .black-3c85d { background: #555 !important; }

.board-color-3 .white-1e1d7 { background: #cfe2f3 !important; }
.board-color-3 .black-3c85d { background: #2f5597 !important; }

.board-color-4 .white-1e1d7 { background: #fce5cd !important; }
.board-color-4 .black-3c85d { background: #783f04 !important; }

#controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

#controls button {
  flex: 1 1 45%;
  max-width: 220px;
}

button, select {
  margin-top: 10px;
  padding: 10px 14px;
  font-size: 16px;
  min-height: 44px;  
  cursor: pointer;
}
</style>
</head>

<body>

  <div id="boardContainer">
    <div id="board" class="fade show"></div>
    <div id="gameMessage"></div>

    <div id="controls">
      <button id="newBtn">New Scenario</button>
      <button id="restartBtn">Restart Scenario</button>
      <button id="flipBtn">Switch Side</button>
      <button id="prevBtn">Previous Scenario</button>
    </div>
  </div>

  <script src="lib/jquery.min.js"></script>
  <script src="lib/chess.min.js"></script>
  <script src="lib/chessboard-1.0.0.min.js"></script>
  <script src="game.js"></script>

</body>
</html>
