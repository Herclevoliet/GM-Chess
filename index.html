<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>GM-Chess</title>
  <link rel="stylesheet" href="lib/chessboard-1.0.0.min.css">

  <style>
#boardContainer {
  position: relative;
  width: 95vw;
  max-width: 500px;
  margin: 40px auto;
}

#board {
  width: 100%;
  aspect-ratio: 1 / 1;
  transform: none;
  transform-style: preserve-3d;
  transition: transform 0.4s ease;
  box-shadow:
    0 12px 25px rgba(0,0,0,0.4),
    0 4px 8px rgba(0,0,0,0.3);
}

.square-55d63 {
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.25),
    inset 0 -3px 5px rgba(0,0,0,0.4);
}

#board img {
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.55));
  transition: transform 0.15s ease, filter 0.15s ease;
}

#board img:hover {
  transform: scale(1.05);
  filter: drop-shadow(0 6px 6px rgba(0,0,0,0.65));
}

#board::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    circle at 30% 20%,
    rgba(255,255,255,0.25),
    rgba(0,0,0,0.4)
  );
  mix-blend-mode: overlay;
}

.selected-square {
  box-shadow:
    inset 0 0 30px rgba(0,120,255,0.95),
    0 0 25px rgba(0,120,255,0.8);
}

.legal-move {
  box-shadow:
    inset 0 0 25px rgba(46,204,113,0.95),
    0 0 20px rgba(46,204,113,0.8);
}

.last-move {
  box-shadow:
    inset 0 0 28px rgba(241,196,15,0.95),
    0 0 22px rgba(241,196,15,0.85);
}

.selected-square,
.legal-move,
.last-move {
  transition: all 0.4s ease;
}

@keyframes pulseGlow {
  0% {
    box-shadow:
      inset 0 0 20px rgba(0, 120, 255, 0.9),
      0 0 12px rgba(0, 120, 255, 0.6);
  }
  50% {
    box-shadow:
      inset 0 0 35px rgba(0, 120, 255, 1),
      0 0 25px rgba(0, 120, 255, 0.9);
  }
  100% {
    box-shadow:
      inset 0 0 20px rgba(0, 120, 255, 0.9),
      0 0 12px rgba(0, 120, 255, 0.6);
  }
}

.selected-square.pulse {
  animation: pulseGlow 1.2s infinite ease-in-out;
}

#gameMessage {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 28px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10;
}

#gameMessage.show {
  opacity: 1;
}

.fade {
  opacity: 0;
  transition: opacity 0.4s ease;
}
.fade.show {
  opacity: 1;
}

.board-color-1 .white-1e1d7 { background: #f0d9b5 !important; }
.board-color-1 .black-3c85d { background: #b58863 !important; }

.board-color-2 .white-1e1d7 { background: #eaeaea !important; }
.board-color-2 .black-3c85d { background: #555 !important; }

.board-color-3 .white-1e1d7 { background: #cfe2f3 !important; }
.board-color-3 .black-3c85d { background: #2f5597 !important; }

.board-color-4 .white-1e1d7 { background: #fce5cd !important; }
.board-color-4 .black-3c85d { background: #783f04 !important; }

#controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

#controls button {
  flex: 1 1 45%;
  max-width: 220px;
}

button, select {
  margin-top: 10px;
  padding: 10px 14px;
  font-size: 16px;
  min-height: 44px;  
  cursor: pointer;
}
</style>
</head>

<body>

  <div id="boardContainer">
    <div id="board" class="fade show"></div>
    <div id="gameMessage"></div>

    <div id="controls">
      <button id="newBtn">New Scenario</button>
      <button id="restartBtn">Restart Scenario</button>
      <button id="flipBtn">Switch Side</button>
      <button id="prevBtn">Previous Scenario</button>
    </div>
  </div>

  <script src="lib/jquery.min.js"></script>
  <script src="lib/chess.min.js"></script>
  <script src="lib/chessboard-1.0.0.min.js"></script>
  <script src="game.js"></script>

</body>
</html>
